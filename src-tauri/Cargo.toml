[package]
name = "neru-screen-control"
description = "Cooler LCD screens, PC RGB lighting and fans — one Linux app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "neru_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neru-screen-control"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neru-core = { path = "../crates/neru-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"
image.workspace = true
jpeg-encoder = { version = "0.7", features = ["simd"] }
