[workspace]
resolver = "2"
members = [
    "crates/neru-core",
    "crates/neru-cli",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Huzzama/Neru-screen-control"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
