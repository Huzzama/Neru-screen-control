[workspace]
resolver = "2"
members = [
    "crates/neru-core",
    "crates/neru-cli",
    "crates/neru-fand",
    "src-tauri",
]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Huzzama/Neru-screen-control"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Dependencies (resvg, image, jpeg) optimised even in `npm run dev`:
# debug builds of them render a 720×720 frame ~10× slower.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
