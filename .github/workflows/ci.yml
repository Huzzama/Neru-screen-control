name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri + libusb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libusb-1.0-0-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI type-check and build
        run: npm --prefix ui run build
      # tauri-build checks that the external binaries exist, so they must be
      # built before anything compiles src-tauri (cargo test builds the workspace).
      - name: Helper binaries build
        run: sh scripts/build-bins.sh debug
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: App compiles
        run: cargo build --locked -p neru-screen-control
