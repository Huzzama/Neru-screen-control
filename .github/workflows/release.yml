name: Release (AppImage)

# Builds the AppImage and attaches it to a GitHub release.
#   git tag v2.0.0 && git push origin v2.0.0      → release "v2.0.0"
# or run it by hand from the Actions tab (builds and uploads an artifact only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Oldest supported Ubuntu = oldest glibc, so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Tauri, libusb, AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libusb-1.0-0-dev pkg-config patchelf file libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build AppImage
        run: npm run build -- --bundles appimage

      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage dist/
          cd dist && sha256sum *.AppImage > SHA256SUMS.txt && ls -la

      - name: Upload artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: neru-screen-control-appimage
          path: dist/*

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Neru Screen Control ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install (any distro)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/Huzzama/Neru-screen-control/main/install.sh | sh
            ```
            Or download the AppImage below, `chmod +x` it and run it.
            After installing, replug the cooler's USB cable once.
