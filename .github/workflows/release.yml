name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # oldest glibc for the AppImage
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri + libusb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libusb-1.0-0-dev pkg-config patchelf file libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundles (deb + AppImage)
        run: npm run build
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/
          cd dist && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: "Neru Screen Control ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*
          body: |
            | File | For |
            |---|---|
            | `*.AppImage` | any distro — `chmod +x`, run |
            | `*.deb` | Debian, Ubuntu, Mint, Pop!_OS |
            | AUR `neru-screen-control` | Arch, CachyOS, EndeavourOS, Manjaro |

            After installing: **Settings → Device access → Install rules** (or `neru udev --install`), replug the screen.
            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
